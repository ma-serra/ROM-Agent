<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROM Agent v3.5 - Dashboard Orchestrator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    @keyframes pulse-ring {
      0%, 100% { transform: scale(0.95); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.5; }
    }
    .pulse-ring { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    @keyframes slide-in {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .slide-in { animation: slide-in 0.3s ease-out; }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#9333ea',
            secondary: '#7c3aed',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 min-h-screen text-white">

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold mb-8 text-center">🧠 ROM Agent v3.5 Dashboard</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="bg-gray-800 rounded-xl p-6">
        <h3 class="text-gray-400 text-sm mb-2">Workflows Ativos</h3>
        <p class="text-3xl font-bold" id="active-workflows">0</p>
      </div>
      <div class="bg-gray-800 rounded-xl p-6">
        <h3 class="text-gray-400 text-sm mb-2">Taxa de Sucesso</h3>
        <p class="text-3xl font-bold text-green-400" id="success-rate">0%</p>
      </div>
      <div class="bg-gray-800 rounded-xl p-6">
        <h3 class="text-gray-400 text-sm mb-2">Cache Hit Rate</h3>
        <p class="text-3xl font-bold text-blue-400" id="cache-hit-rate">0%</p>
      </div>
      <div class="bg-gray-800 rounded-xl p-6">
        <h3 class="text-gray-400 text-sm mb-2">Tokens Claude 3.7</h3>
        <p class="text-3xl font-bold text-yellow-400" id="tokens-consumed">0</p>
      </div>
    </div>

    <div class="bg-gray-800 rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-4">📊 Dashboard em Tempo Real</h2>
      <p class="text-gray-400" id="status-message">Carregando métricas...</p>
      <p class="text-sm text-gray-500 mt-2" id="last-update"></p>
    </div>
  </div>

  <script>
    // Função para formatar números
    function formatNumber(num) {
      if (num >= 1000000) {
        return (num / 1000000).toFixed(1) + 'M';
      } else if (num >= 1000) {
        return (num / 1000).toFixed(1) + 'K';
      }
      return num.toLocaleString('pt-BR');
    }

    // Função para buscar métricas
    async function fetchMetrics() {
      try {
        const response = await fetch('/api/orchestrator/metrics', {
          credentials: 'include'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (data.success && data.metrics) {
          const m = data.metrics;

          // Atualizar cards
          document.getElementById('active-workflows').textContent = m.activeWorkflows || 0;
          document.getElementById('success-rate').textContent = (m.successRate || 0) + '%';
          document.getElementById('cache-hit-rate').textContent = (m.cacheHitRate || 0) + '%';
          document.getElementById('tokens-consumed').textContent = formatNumber(m.tokensConsumed || 0);

          // Atualizar status
          document.getElementById('status-message').textContent =
            `✅ Conectado | ${m.totalExecutions || 0} execuções | Custo estimado: $${m.estimatedCost || '0.00'}`;

          document.getElementById('last-update').textContent =
            `Última atualização: ${new Date(m.timestamp).toLocaleTimeString('pt-BR')}`;
        }
      } catch (error) {
        console.error('Erro ao buscar métricas:', error);
        document.getElementById('status-message').textContent =
          '⚠️ Erro ao conectar ao servidor - Tentando reconectar...';
      }
    }

    // Buscar métricas imediatamente
    fetchMetrics();

    // Atualizar a cada 10 segundos
    setInterval(fetchMetrics, 10000);
  </script>

</body>
</html>
